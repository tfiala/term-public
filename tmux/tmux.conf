# term-public base tmux config.
#
# `hive tmux` generates a per-hive config that `source-file`s this file
# first, so the settings below apply to every hive session (and to plain
# tmux sessions).

# --- Prefix: backtick ---------------------------------------------------------
# The `hive tmux` keybindings (backtick + c/b/g/G/C-g/R/r) live in the
# prefix table, so the prefix must be backtick.
set -g prefix `
unbind C-b
bind ` send-prefix

# --- Shell: Homebrew bash (#15) -----------------------------------------------
# Agents (Claude CLI, Codex) keep tripping over zsh-isms, so every pane
# runs bash.  Only Homebrew bash 5.x qualifies — macOS /bin/bash is 3.2 —
# so fall back to the login shell when it isn't installed yet.  Both
# lines run in order; the native-prefix one wins when both exist.
if-shell 'test -x /usr/local/bin/bash' 'set -g default-shell /usr/local/bin/bash'
if-shell 'test -x /opt/homebrew/bin/bash' 'set -g default-shell /opt/homebrew/bin/bash'

# --- Claude CLI rendering (ADR-0063) ------------------------------------------
# allow-passthrough lets Claude CLI's DEC 2026 synchronized-output and
# progress sequences pass through tmux instead of being mangled — the
# decisive setting that makes Claude CLI render correctly inside tmux.
set -g allow-passthrough on

set -s default-terminal "tmux-256color"
# True colour + the terminal features Claude CLI needs. Non-appending
# `set -s` (not `set -as`) so re-sourcing the config doesn't duplicate.
set -s terminal-overrides 'linux*:AX@,*256col*:RGB'
# `sync` = synchronized output (BSU/ESU): tmux renders complete frames
# atomically, which kills the streaming-update flicker. `extkeys` passes
# Shift+Enter and other modifier combos through to the application.
set -s terminal-features 'xterm-ghostty:clipboard:ccolour:cstyle:focus:title:extkeys:sync,xterm*:clipboard:ccolour:cstyle:focus:title:extkeys:sync,screen*:title,rxvt*:ignorefkeys'
# `always`: tmux doesn't recognize Claude CLI's CSI-u request, so forward
# extended keys unconditionally rather than only when the app asks.
set -s extended-keys always
# Encode forwarded extended keys in CSI-u form (ESC[13;2u) rather than tmux's
# default `xterm` modifyOtherKeys form (ESC[27;2;13~). Claude CLI decodes both,
# but Codex CLI enables crossterm's kitty keyboard protocol, whose decoder only
# recognizes CSI-u — under the `xterm` default it silently drops Shift+Enter, so
# the composer never inserts a newline. csi-u makes Shift+Enter work in both.
set -s extended-keys-format csi-u
set -sg escape-time 0
set -g focus-events on
set -g history-limit 250000

# Mouse on: without it, Ghostty's alternate-scroll mode turns the
# scroll-wheel into Up/Down arrows, which the shell interprets as
# history navigation instead of scrollback. ADR-0063's allow-passthrough
# keeps Claude CLI rendering correctly with mouse mode enabled.
set -g mouse on

# --- Copy-mode & message styling ----------------------------------------------
# tmux's defaults here are ANSI named colors (mode-style is bg=yellow,
# fg=black, and so on). The appearance-pair Ghostty theme remaps ANSI 0-15
# per mode, and the day theme (GitHub Light High Contrast) maps yellow,
# cyan, magenta, and red to dark shades for contrast on white — which
# turned every one of these defaults dark-on-dark in day mode, most
# visibly an unreadable mouse-drag selection. Pin them in truecolor so
# the palette remap can't reach them: each pair reads on both the night
# (#292d3e) and day (#ffffff) backgrounds. mode-style matches palenight's
# Ghostty selection, so tmux and native selections look alike at night.
set -g mode-style "fg=#eceff1,bg=#607d8b"
set -g copy-mode-match-style "fg=#292d3e,bg=#ffcb6b"
set -g copy-mode-current-match-style "fg=#292d3e,bg=#ffa726"
set -g copy-mode-mark-style "fg=#292d3e,bg=#f07178"
set -g message-style "fg=#292d3e,bg=#ffcb6b"
set -g message-command-style "fg=#ffcb6b,bg=#292d3e"

# --- Sensible defaults --------------------------------------------------------
set-window-option -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g aggressive-resize off

# Reload this config (a hive session's generated config overrides this
# binding to reload the hive config instead).
bind r source-file "$HOME/.tmux/tmux.conf" \; display "Reloaded!"

# Splits and pane navigation.
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# 'v' begins a character selection in copy-mode-vi.
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection

# Ctrl-o: clear screen + scrollback (like Cmd-K in Terminal/iTerm).
bind -n C-o send-keys " reset && tmux clear-history" "Enter"
